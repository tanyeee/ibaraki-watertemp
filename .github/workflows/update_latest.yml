name: update_latest_cards (kawabou)

on:
  workflow_dispatch:
  schedule:
    # 毎時23分(川の防災情報は毎正時更新)。日次更新との同時実行はconcurrencyで避ける。
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: watertemp-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update river/lake water temperature (kawabou)
        id: update_latest
        run: |
          failures=0
          if ! python scripts/update_kawabou_qwtr.py; then
            echo "::error::failed to update from kawabou"
            failures=1
          fi
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/river
          if ! git diff --cached --quiet; then
            git commit -m "Update river/lake water temperature from kawabou"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Fail workflow if any source failed
        if: always()
        env:
          FAILURES: ${{ steps.update_latest.outputs.failures }}
        run: |
          failures=${FAILURES:-0}
          if [ "$failures" -ne 0 ]; then
            echo "::error::latest observation update completed with $failures failure(s)"
            exit 1
          fi
